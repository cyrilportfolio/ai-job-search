<script type="application/ld+json" id="jobposting-jsonld">{"@context":"https://schema.org","@type":"JobPosting","title":"Accountants - DE/EN - 12 months CDD","description":"Leading Real Estate Company – Junior Accountants – GER & ENG speakers - 12 months CDD\n\nAbout the Company\nOur client is one of the leading commercial real estate companies in Europe, focusing on the ownership and management of modern logistics and distribution properties.\n\nThe main headquarters are in London and Luxembourg, with regional offices managing the European operations. Today, they are looking for 2 Junior Accountants to reinforce the Finance department team here in Luxembourg for an initial 12 months CDD.\n\nThis is a great opportunity for someone looking to launch a career in finance within the real estate sector. Join a modern, collaborative, and supportive company that values teamwork, trust, and professional growth while offering flexibility and career development opportunities.\n\nThe Role\nFinancial Operations & Accounting\n\n\tReview and process invoices, ensuring accurate coding and compliance with financial policies\n\tWork closely with property managers to maintain accurate financial records\n\tReconcile accounts and investigate discrepancies in financial transactions\n\tAssist with journal entries, general ledger maintenance, and cash flow monitoring\n\tOversee bank reconciliations and manage cash accounting\n\tMatch invoices with purchase orders and ensure proper documentation\n\n\nMonthly and year-end reporting\n\n\n\tAnalyze monthly trial balances and identify variances\n\tSupport month-end and year-end closing processes\n\tAssist in the preparation of financial reports and annual accounts\n\tGenerate ad hoc reports and reconciliations as needed\n\n\nGeneral Administration & Audit Support\n\n\n\tAssist in internal and external audits, ensuring compliance with accounting standards\n\tPrepare VAT and CIT returns for relevant jurisdictions (Luxembourg/Dutch/German)\n\tLiaise with auditors, tax consultants, and legal advisors as required\n\tContribute to process improvements and support technology-driven efficiencies in accounting operations\n\n\nThe Profile\n\n\n\tA degree or certification in financial accounting\n\t1 to 3 years' experience as accountant in Luxembourg\n\tFluency in German is essential for one role \n\tFluency in English (additional European languages are advantageous)\n\tProficiency in MS Office applications and a willingness to embrace technology-driven efficiencies\n\tStrong teamwork and problem-solving abilities\n\tA keen eye for detail and accuracy in financial transactions\n\n\nThis is an excellent opportunity to be part of a flexible and supportive work environment where you can grow your career while making a real impact. If you are looking for a role that offers both professional challenges and development, we’d love to hear from you!\n\nGreenfield Luxembourg is an equal opportunities employer and welcomes applicants from all sectors of the Community. Due to the nature of our client engagements, we are however unable to support applicants that are outside of our core market areas; and/or do not have an existing eligibility to work in Luxembourg or are not EEA/EU/Schengen country Citizens. We are unable to provide work permits or visa sponsorship opportunities.","datePosted":"2026-07-17T14:30:48.902Z","hiringOrganization":{"@type":"Organization","name":"Greenfield Group","logo":"https://www.greenfield.lu/assets/site_favicon.svg"},"jobLocation":{"@type":"Place","addressRegion":"Luxembourg"},"validThrough":"2051-07-08T23:59:59.999Z"}</script>
